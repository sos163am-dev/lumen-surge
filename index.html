<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0a1420"><title>SUNBURST v750</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1c3548,#02040a 72%);color:#ffe18d;font:800 15px system-ui;letter-spacing:.12em}.l{animation:p 1.25s ease-in-out infinite alternate;text-align:center;line-height:1.7}@keyframes p{to{opacity:.45;transform:scale(.985)}}</style></head><body><div class="l">СВЯЗЬ СВЕТА ПРОБУЖДАЕТСЯ…<br><span style="font-size:10px;color:#9bdce2">LIVING LIGHT · v750</span></div><script>(async()=>{try{const names=['assets/sunburst-v750-gz0.b64?v=750','assets/sunburst-v750-gz1.b64?v=750','assets/sunburst-v750-gz2.b64?v=750'];const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.text()}));const raw=atob(parts.join('').replace(/\s/g,''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('DecompressionStream unavailable');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div style="max-width:430px;padding:24px;text-align:center;line-height:1.5">Не удалось загрузить игру.<br>Обнови страницу или открой её в Chrome.</div>'}})();</script></body></html>
