<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#030711"><title>SUNBURST</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#17254a,#02040a 70%);color:#ffd45b;font:800 15px system-ui;letter-spacing:.12em}.l{animation:p .9s ease-in-out infinite alternate;text-align:center}@keyframes p{to{opacity:.35;transform:scale(.97)}}</style></head><body><div class="l">ПРОБУЖДАЕМ ЭЛИОН…</div><script>(async()=>{try{const names=['assets/sunburst-v700-gz0.b64?v=700','assets/sunburst-v700-gz1.b64?v=700','assets/sunburst-v700-gz2.b64?v=700'];const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.text()}));const raw=atob(parts.join('').replace(/\s/g,''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('Этот браузер не поддерживает распаковку игры');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div style="max-width:420px;padding:24px;text-align:center;line-height:1.5">Не удалось загрузить игру.<br>Обнови страницу или открой её в Chrome.</div>'}})();</script></body></html>
